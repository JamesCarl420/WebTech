<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>Student Registration</h1>
      <p>Practice form controls and HTML attributes.</p>
    </div>
  </header>
  <main class="container page-content">
    <form class="form-card" action="#" method="get">
      <div class="form-grid">
        <div class="form-group">
          <label for="student-id">Student ID</label>
          <input id="student-id" name="student-id" type="text" placeholder="Enter your student ID" required>
        </div>
        <div class="form-group">
          <label for="full-name">Full Name</label>
          <input id="full-name" name="full-name" type="text" placeholder="Enter your full name" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Create a password" required>
        </div>
        <fieldset class="form-group">
          <legend>Gender</legend>
          <label class="inline-option"><input type="radio" name="gender" value="male"> Male</label>
          <label class="inline-option"><input type="radio" name="gender" value="female"> Female</label>
        </fieldset>
        <div class="form-group">
          <label for="course">Course</label>
          <select id="course" name="course" required>
        <option value="BSIT">BSIT Information Technology</option>
        <option value="BSCS">BSCS Computer Science</option>
        <option value="BSIS">BSDA Data analytic</option>
        <option value="BMMA">BMMA Multimedia Arts</option>
        </select>
        </div>
        <fieldset class="form-group">
          <legend>Hobbies</legend>
          <label class="inline-option"><input type="checkbox" name="hobbies" value="Sports"> Sports</label>
          <label class="inline-option"><input type="checkbox" name="hobbies" value="Reading"> Reading</label>
          <label class="inline-option"><input type="checkbox" name="hobbies" value="gaming"> Gaming</label>
        </fieldset>
        <div class="form-group full-width">
          <label for="address">Address</label>
          <textarea id="address" name="address" rows="3" placeholder="Enter your address"></textarea>
        </div>
      </div>
      <button class="button" type="submit">Submit Registration</button>
    </form>
  </main>
  <footer class="site-footer"><p>&copy; 2026 Student Registration</p></footer>
</body>
</html>
