
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model</title>
    <link rel="stylesheet" href="style4.css">
</head>
<body>

    <h1>Understanding the CSS Box Model</h1>

    <div class="card">
        <h2>Content</h2>
        <p>Content is the information inside an HTML element.</p>
    </div>

    <div class="card">
        <h2>Padding</h2>
        <p>Padding is the space between content and the border.</p>
    </div>

    <div class="card">
        <h2>Margin</h2>
        <p>Margin is the space outside an element's border.</p>
    </div>

</body>
</html>
